name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  python-and-typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-python@v7
        with: { python-version: '3.12' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run setup
      - run: node scripts/test.mjs --no-rust
      - run: pnpm verify:receipts
      - run: pnpm demo:offline
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: rustup show   # installs the toolchain pinned in rust-toolchain.toml
      - run: cargo test --manifest-path contracts/aegis-vault/Cargo.toml --locked
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @aegis/web typecheck
      - run: pnpm build
      - run: pnpm build:static
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
