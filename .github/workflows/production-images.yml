name: Production container images

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/production-images.yml'
      - 'apps/**'
      - 'packages/**'
      - 'services/**'
      - 'scripts/**'
      - 'deploy/**'
      - 'artifacts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'requirements.txt'
      - 'compose.production.yml'
      - '.dockerignore'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: production-images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-production-model:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 24 }
      - name: Validate configuration contract and Compose model
        env:
          AEGIS_PUBLIC_ORIGIN: https://ci.aegis.invalid
          AEGIS_OWNER_TOKEN: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          AEGIS_VERIFIER_TOKEN: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          AEGIS_IMAGE_TAG: ci
          NEAR_VAULT_ID: vault.ci.testnet
          NEAR_OWNER_ID: owner.ci.testnet
          NEAR_AGENT_ID: agent.ci.testnet
          NEAR_ATTESTOR_ID: attestor.ci.testnet
          NEAR_RECIPIENT_ID: recipient.ci.testnet
        run: |
          export NEAR_OWNER_PRIVATE_KEY="ed25519:$(printf '1%.0s' {1..88})"
          export NEAR_AGENT_PRIVATE_KEY="ed25519:$(printf '2%.0s' {1..88})"
          export NEAR_ATTESTOR_PRIVATE_KEY="ed25519:$(printf '3%.0s' {1..88})"
          node scripts/validate-production.mjs
          docker compose -f compose.production.yml config --quiet

  build-and-publish:
    needs: validate-production-model
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: service
            dockerfile: deploy/Dockerfile.service
          - image: web
            dockerfile: deploy/Dockerfile.web
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=AEGIS Counterfactual ${{ matrix.image }}
            org.opencontainers.image.description=Production runtime for the AEGIS counterfactual authorization boundary
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          provenance: mode=max
          sbom: true

