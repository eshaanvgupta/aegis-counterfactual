worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  log_format structured escape=json
    '{"time":"$time_iso8601","remote":"$remote_addr","method":"$request_method",'
    '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time}';
  access_log /dev/stdout structured;
  error_log /dev/stderr warn;

  limit_req_zone $binary_remote_addr zone=aegis_api:10m rate=120r/m;
  limit_req_zone $binary_remote_addr zone=aegis_owner:10m rate=30r/m;

  upstream web_upstream { server web:3000; }
  upstream agent_upstream { server agent:8000; }
  upstream owner_upstream { server owner:8002; }

  server {
    listen 8080;
    client_max_body_size 512k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /healthz {
      access_log off;
      default_type application/json;
      return 200 '{"service":"aegis-gateway","status":"ok"}';
    }

    location /api/ {
      limit_req zone=aegis_api burst=30 nodelay;
      proxy_pass http://agent_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 190s;
    }

    location /owner-api/ {
      limit_req zone=aegis_owner burst=10 nodelay;
      proxy_pass http://owner_upstream/;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Origin $http_origin;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 130s;
    }

    location / {
      proxy_pass http://web_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_connect_timeout 5s;
      proxy_read_timeout 130s;
    }
  }
}

